plugins {
    id "com.android.application"
}

android {
    namespace "com.jjabs.videotogif"
    compileSdk 35

    defaultConfig {
        applicationId "com.jjabs.videotogif"
        minSdk 28
        targetSdk 34
        versionCode 11
        versionName "2.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
