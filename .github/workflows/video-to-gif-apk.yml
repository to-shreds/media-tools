name: Build Video to GIF APK

on:
  push:
    paths:
      - "android/video-to-gif/**"
      - ".github/workflows/video-to-gif-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: android/video-to-gif
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoToGif-APK
          path: android/video-to-gif/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
